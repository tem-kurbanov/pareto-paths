<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
<title id="title">Pareto Paths: more than one shortest path</title>
<desc id="desc">Three nondominated routes trade travel time against distance: costs 4 and 16, 8 and 6, or 12 and 2.</desc>
<rect width="1120" height="420" rx="16" fill="#16243a"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="48" y="55" font-size="16" letter-spacing="4" fill="#8ed6c6">PARETO / PATHS</text>
<text x="48" y="138" font-size="43" font-weight="700" fill="#faf9f6">More than one</text>
<text x="48" y="191" font-size="43" font-weight="700" fill="#faf9f6">shortest path.</text>
<text x="48" y="241" font-size="18" fill="#b9c7d9">Multicriteria routing. Compressed graphs.</text>
<text x="48" y="269" font-size="18" fill="#b9c7d9">The complete Pareto tradeoff.</text>
<line x1="48" y1="311" x2="460" y2="311" stroke="#39475b"/>
<text x="48" y="346" font-size="12" letter-spacing="1.5" fill="#8ed6c6">C++20   /   k-PATH COVERS   /   EV ROUTING</text>
<text x="48" y="375" font-size="13" fill="#b9c7d9">From published research to reusable software.</text>
<g fill="none" stroke-width="3">
<path d="M605 212 Q710 36 810 100 Q924 133 1025 212" stroke="#e8b46a"/>
<path d="M605 212 Q710 190 810 212 L1025 212" stroke="#8ed6c6"/>
<path d="M605 212 Q710 380 810 324 Q924 285 1025 212" stroke="#83aaf3"/>
</g>
<g fill="#16243a" stroke="#b9c7d9" stroke-width="2">
<circle cx="605" cy="212" r="18"/><circle cx="1025" cy="212" r="18"/>
</g>
<g stroke="#16243a" stroke-width="5">
<circle cx="810" cy="100" r="8" fill="#e8b46a"/>
<circle cx="810" cy="212" r="8" fill="#8ed6c6"/>
<circle cx="810" cy="324" r="8" fill="#83aaf3"/>
</g>
<text x="584" y="254" fill="#b9c7d9" font-size="12">START</text>
<text x="1008" y="254" fill="#b9c7d9" font-size="12">GOAL</text>
<text x="851" y="96" fill="#e8b46a" font-size="17">[4, 16]</text>
<text x="851" y="198" fill="#8ed6c6" font-size="17">[8, 6]</text>
<text x="851" y="339" fill="#83aaf3" font-size="17">[12, 2]</text>
<text x="730" y="391" fill="#b9c7d9" font-size="12" letter-spacing="1">FASTER ↔ SHORTER</text>
</g>
</svg>
